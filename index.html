<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Faith Arguments</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Playfair+Display:wght@400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <span class="site-title">Faith Arguments</span>
    <nav id="site-nav" class="site-nav"></nav>
  </header>
  <main class="wide">
    <section class="hero">
      <h1 class="hero-title">Faith Arguments</h1>
      <p class="hero-subtitle">Arguments for God and Christianity</p>
    </section>
    <div id="topic-groups-root"></div>
  </main>
  <script src="js/main.js"></script>
  <script src="js/components/topic-groups.js"></script>
  <script>
    (async function () {
      try {
        const topics = await FaithApp.loadTopics();
        FaithApp.renderNav(topics, null, document.getElementById('site-nav'));
        FaithApp.renderTopicGroups(topics, document.getElementById('topic-groups-root'));
      } catch (err) {
        const root = document.getElementById('topic-groups-root');
        root.innerHTML = '';
        const message = document.createElement('p');
        message.className = 'summary';
        message.textContent = "Couldn't load topics. If you opened this file directly, serve the folder over http instead.";
        root.appendChild(message);
      }
    })();
  </script>
</body>
</html>
